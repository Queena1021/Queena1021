name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots runs empty -> most active. Without it the snake is
          # GitHub green, which belongs to no palette anyone picks.
          #
          # The ramp has to *step*. A first attempt kept levels 0-2 all in the
          # pale end of the palette to stay on-theme, and 121 contributions
          # rendered as an apparently empty grid.
          outputs: |
            dist/github-snake.svg?color_snake=#a83d6e&color_dots=#e8f4fd,#9bdcf7,#4a9fd4,#2a6f96,#14435f
            dist/github-snake-dark.svg?color_snake=#ff9ec6&color_dots=#16202b,#1f4e6e,#2f7fae,#6fc0e6,#cfeafa

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
