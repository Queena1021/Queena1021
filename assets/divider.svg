<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="26" viewBox="0 0 1000 26" role="img" aria-label="">
  <defs>
    <!-- Fades to transparent at both ends so the rule reads on a white page
         and on a dark one without carrying a background of its own. -->
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a9fd4" stop-opacity="0"/>
      <stop offset="22%" stop-color="#4a9fd4" stop-opacity=".75"/>
      <stop offset="50%" stop-color="#ff9ec6" stop-opacity=".9"/>
      <stop offset="78%" stop-color="#4a9fd4" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#4a9fd4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- A <rect>, not a <line>: a line has zero height, so its bounding box has
       no area and an objectBoundingBox gradient resolves to nothing. -->
  <rect x="0" y="12" width="1000" height="2" fill="url(#rule)"/>

  <rect x="-200" y="12" width="200" height="2" fill="url(#sheen)">
    <animate attributeName="x" values="-200;1000" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(500,13)">
    <circle cx="-16" cy="0" r="2" fill="#4a9fd4" opacity=".8"/>
    <circle cx="16" cy="0" r="2" fill="#4a9fd4" opacity=".8"/>
    <path d="M0,-7 Q1.4,-1.4 7,0 Q1.4,1.4 0,7 Q-1.4,1.4 -7,0 Q-1.4,-1.4 0,-7 Z" fill="#ff9ec6">
      <animate attributeName="opacity" values=".55;1;.55" dur="3.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360"
                        dur="18s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
